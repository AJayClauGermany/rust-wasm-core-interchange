[package]
name = "wasm-backend-ffi"
version = "0.1.0"
license = "Apache-2.0 WITH LLVM-exception"
description = "C interface to wasm-backend-core: host hot-reloadable, capability-restricted WebAssembly backend modules from any language that can call C."
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/AJayClauGermany/rust-wasm-core-interchange"
# The integration tests use guests and hosts from the repository.
exclude = ["/tests"]

[lib]
# The library other languages load: libwasm_backend.so, libwasm_backend.dylib,
# wasm_backend.dll (and the static libwasm_backend.a / wasm_backend.lib).
name = "wasm_backend"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["component", "extism", "hot-reload"]
# WIT / WebAssembly component model engine (wasmtime).
component = ["wasm-backend-core/component"]
# Extism plugin engine.
extism = ["wasm-backend-core/extism"]
# Watch module files and reload them on change.
hot-reload = ["wasm-backend-core/hot-reload"]

[dependencies]
wasm-backend-core = { version = "0.1.0", path = "../wasm-backend-core", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }

[dev-dependencies]
# Checks that include/wasm_backend.h matches the functions exported here.
cbindgen = { version = "0.29", default-features = false }
