name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail instead of skipping guests and hosts whose toolchain is missing.
  WASM_CORE_REQUIRE_ALL_GUESTS: "1"
  WASM_CORE_REQUIRE_ALL_HOSTS: "1"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guests/javascript/package-lock.json
      - name: Install JavaScript guest toolchain
        run: npm ci
        working-directory: guests/javascript
      # The Python host; the C host uses the runner's `cc`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: cargo test --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --no-default-features
      - run: cargo check --workspace --no-default-features --features component
      - run: cargo check --workspace --no-default-features --features extism
      - run: cargo check --workspace --no-default-features --features hot-reload
      - run: cargo check --workspace --all-features
